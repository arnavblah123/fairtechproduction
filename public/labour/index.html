<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#15803d" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👷</text></svg>" />
    <title>FairTech Labour Management</title>
    <script type="module" crossorigin src="./assets/index-BaRglQO6.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CX2CU7J6.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Injected by the production host, in plain ES5 on purpose: if the
         app hasn't mounted after a few seconds (old browser that can't run
         the modern bundle), explain instead of showing a blank page. -->
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childNodes.length === 0) {
          var d = document.createElement('div');
          d.setAttribute('style', 'padding:32px 20px;font-family:Arial,Helvetica,sans-serif;color:#0f172a;text-align:center;');
          d.innerHTML =
            '<h2 style="margin:0 0 10px">⚠️ App could not load</h2>' +
            '<p style="margin:0 0 6px">This phone&#39;s browser is too old for the Labour app.</p>' +
            '<p style="margin:0 0 14px"><b>Fix: open <span style="color:#15803d">Play Store</span> &#8594; install/update <span style="color:#15803d">Google Chrome</span> &#8594; open this same link in Chrome.</b></p>' +
            '<p style="margin:0"><a href="/" style="color:#1d4ed8">&#8592; Back to Production app</a></p>';
          root.appendChild(d);
        }
      }, 4000);
    </script>
    <!-- Injected by the production app host: session logout (the embedded
         copy signs in via the production login, so it needs a way out). -->
    <a href="/api/logout"
       style="position:fixed;top:10px;right:10px;z-index:9999;background:#15803d;color:#fff;font:600 12px/1 Arial,Helvetica,sans-serif;padding:8px 12px;border-radius:999px;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.3);opacity:.92">
      Log out
    </a>
  </body>
</html>
